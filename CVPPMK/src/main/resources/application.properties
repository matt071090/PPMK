# Default non-rahasia. Koneksi DB (url, username, password) ada di ./application.properties (root project, tidak di-commit).
server.port=8090
# 0.0.0.0 = bisa dibuka dari PC lain di jaringan: http://<ip-pc>:8090/cvppmk/ (127.0.0.1 = hanya dari PC ini)
server.address=0.0.0.0
server.servlet.context-path=/cvppmk
# Semua respons (HTML, CSS, JS, JSON) dikirim dengan charset=UTF-8, juga saat jalan sebagai war di Tomcat.
# Tanpa ini Tomcat/browser di server bisa menebak Windows-1252 dan karakter seperti "›" tampil jadi "â€º".
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.application.name=cvppmk-docs
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
logging.level.com.stem=DEBUG
# Count Document: kompresi respons JSON/JS/HTML (data ringkas bisa ratusan ribu baris). Fitur Count Document sendiri harus dinyalakan di application.properties luar: countdoc.enabled=true
server.compression.enabled=true
server.compression.min-response-size=2048

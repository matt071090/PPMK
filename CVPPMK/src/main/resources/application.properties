# Default non-rahasia. Koneksi DB (url, username, password) ada di ./application.properties (root project, tidak di-commit).
server.port=8090
# 0.0.0.0 = bisa dibuka dari PC lain di jaringan: http://<ip-pc>:8090/cvppmk/ (127.0.0.1 = hanya dari PC ini)
server.address=0.0.0.0
server.servlet.context-path=/cvppmk
spring.application.name=cvppmk-docs
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
logging.level.com.stem=DEBUG

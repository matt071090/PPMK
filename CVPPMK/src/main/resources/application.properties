# Default non-rahasia. Koneksi DB (url, username, password) ada di ./application.properties (root project, tidak di-commit).
server.port=8090
# 0.0.0.0 = bisa dibuka dari PC lain di jaringan: http://<ip-pc>:8090/cvppmk/ (127.0.0.1 = hanya dari PC ini)
server.address=0.0.0.0
server.servlet.context-path=/cvppmk
# Semua respons (HTML, CSS, JS, JSON) dikirim dengan charset=UTF-8, juga saat jalan sebagai war di Tomcat.
# Tanpa ini Tomcat/browser di server bisa menebak Windows-1252 dan karakter seperti "›" tampil jadi "â€º".
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.application.name=cvppmk-docs
spring.profiles.active=@deployment.profile@
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
logging.level.com.stem=DEBUG
# Count Document: kompresi respons JSON/JS/HTML (data ringkas bisa ratusan ribu baris). Fitur Count Document sendiri harus dinyalakan di application.properties luar: countdoc.enabled=true
server.compression.enabled=true
server.compression.min-response-size=2048

# Query BUATAN pengguna di Count Document > Daftar Query (SQL SELECT bebas). MATI secara default; tidak ada di sini = mati.
# Jangan dinyalakan sebelum ada akun HANA SELECT-only untuk datasource: validator SQL membatasi bentuk query (SELECT tunggal, tanpa tulis/DDL),
# tetapi tidak membatasi tabel yang dibaca, jadi akun HANA-lah pagar terakhirnya. Dinyalakan dengan: countdoc.custom.enabled=true (lalu jalankan ulang aplikasi)
#countdoc.custom.enabled=false

# File statis (HTML/JS/CSS) selalu dicek ulang ke server (304 bila tidak berubah), supaya perubahan langsung terlihat tanpa Ctrl+F5.
spring.web.resources.cache.cachecontrol.no-cache=true

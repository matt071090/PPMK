# LIVE endpoint decided by Fakhri 2026-11-24; SL port 50000 is assumed, overridable.
# All credentials (including the HANA user) come only from the runtime environment.
spring.application.name=wbi-docs
server.servlet.context-path=/wbi
spring.datasource.url=jdbc:sap://${WBI_HANA_HOST:192.168.40.181}:${WBI_HANA_PORT:30015}/?currentSchema=WBI
spring.datasource.driver-class-name=com.sap.db.jdbc.Driver
spring.datasource.username=${WBI_HANA_USER}
spring.datasource.password=${WBI_HANA_PASSWORD}
spring.datasource.hikari.read-only=true
sap.sl.url=${WBI_SL_URL:https://192.168.40.181:50000/b1s/v1}
sap.sl.company-db=WBI
sap.sl.username=${WBI_SL_USER}
sap.sl.password=${WBI_SL_PASSWORD}
sap.sl.trust-all-certs=${WBI_SL_TRUST_ALL_CERTS:false}
docs.edit.enabled=false
docs.open-browser=false
docs.setup.password=${WBI_SETUP_PASSWORD}
docs.data.dir=${WBI_DATA_DIR:${catalina.base:.}/data}
docs.company=wbi
docs.company-name=PT Warung Begok Indonesia
docs.schedule.seed=schedule/default-wbi.json
hana.enabled=false
setup.farm-breeding.enabled=false
setup.retail.enabled=true
# LIVE: read source and SL destination are both WBI.
setup.source-dbs=WBI
setup.source.allow-target=true

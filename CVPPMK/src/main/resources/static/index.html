<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Check List CVPPMK</title>
<link rel="stylesheet" href="css/app.css">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch { }</script>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Buka menu">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/ringkasan"><span class="logo">PP</span>
    <span><small>Project Check List SAP B1</small><span>CV. Putra Prima Mandiri Kediri</span></span></a>
  <button class="search-btn" id="search-btn" type="button" aria-label="Cari">
    <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="txt">Cari pengaturan&hellip;</span><kbd>Ctrl K</kbd>
  </button>
  <a class="edit-btn" id="setup-btn" href="setup.html" title="Setup & Cut Off: bandingkan data DB sumber, export, upload ke SAP">
    <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7M14 13l2 2 3-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Setup</span>
  </a>
  <button class="edit-btn" id="edit-btn" type="button" aria-pressed="false" title="Mode edit: status review menu & exclusion temuan">
    <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3L7 16H4v-3z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
    <span>Mode edit</span>
  </button>
  <button class="icon-btn" id="theme-btn" type="button" aria-label="Ganti tema terang/gelap">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
  </button>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="Navigasi"><nav id="nav"></nav></aside>
  <main class="content">
    <div class="pagebar" id="pagebar" hidden><nav class="toc" id="toc-list" aria-label="Di halaman ini"></nav><div class="toc-meta" id="toc-meta"></div></div>
    <article class="article" id="article"></article>
  </main>
</div>

<dialog class="search" id="search" aria-label="Pencarian">
  <div class="search-head">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search-q" type="text" placeholder="Cari halaman atau pengaturan, mis. &quot;credit limit&quot;, &quot;batch&quot;, &quot;OADM&quot;" autocomplete="off">
    <kbd>Esc</kbd>
  </div>
  <ul class="results" id="results"></ul>
  <div class="search-foot"><span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> pilih</span><span><kbd>Enter</kbd> buka</span></div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>

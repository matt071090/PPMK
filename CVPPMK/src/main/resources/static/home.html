<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · SAP B1</title>
<link rel="stylesheet" href="css/app.css">
<script>try { const t = localStorage.getItem("theme"); document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="js/modnav.js" defer></script>
<style>
.home .content > .article { max-width: none; }
.home .list .when { flex: none; width: 92px; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 13px; padding-top: 2px; }
.home .list .pic { flex: none; font-size: 12px; color: var(--text-2); padding-top: 3px; white-space: nowrap; }
.home .modnav { border-bottom: 0; margin-bottom: 0; }
.home .hm-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.home .hm-head h1 { margin: 0; }
.home .hm-head p { margin: 4px 0 0; color: var(--text-2); }
.home .hm-hero { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 16px; margin-bottom: 24px; }
.home .countdown { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 18px 22px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent-strong); }
.home .countdown strong { font-size: 52px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.home .countdown span { font-weight: 650; }
.home .countdown small { color: var(--text-2); margin-top: 6px; }
.home .next-box { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 16px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); min-width: 0; }
.home .next-box .lbl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.home .next-box b { font-size: 18px; }
.home .bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.home .bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.home .mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 28px; }
/* Setup & Cut Off, Tools, dan status koneksi hanya untuk admin (kelas is-admin dipasang js/modnav.js) */
.home .admin-only { display: none !important; }
html.is-admin .home .admin-only { display: flex !important; }
html.is-admin .home section.admin-only { display: block !important; }
.home .mod { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); color: var(--text); min-width: 0; }
.home .mod:hover { border-color: var(--c); text-decoration: none; }
.home .mod h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; color: var(--c); }
.home .mod .big { font-size: 26px; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.home .mod .big small { font-size: 14px; font-weight: 500; color: var(--text-2); }
.home .mod .sub { font-size: 13px; color: var(--text-2); }
.home .mod .go { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--accent-strong); }
.home .m-sched { --c: var(--info); } .home .m-check { --c: #6d5bd0; } .home .m-setup { --c: var(--warn); } .home .m-tools { --c: var(--muted); }
:root[data-theme="dark"] .home .m-check { --c: #a99cf0; }
.home .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.home .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.home .panel h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.home .panel h2 .pill { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); }
.home .list { list-style: none; margin: 0; padding: 0; }
.home .list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--border); }
.home .list li:first-child { border-top: 0; padding-top: 2px; }
.home .list .t { flex: 1; min-width: 0; }
.home .list .t a { font-weight: 600; }
.home .list .t small { display: block; color: var(--muted); }
.home .tag { flex: none; font-size: 12px; font-weight: 650; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; }
.home .tag.telat, .home .tag.nok, .home .tag.bad { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.home .tag.soon { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.home .tag.belum { color: var(--text-2); background: var(--surface-2); border-color: var(--border-strong); }
.home .tag.proses { color: var(--info); background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.home .tag.good { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.home .muted { color: var(--muted); }
.home .msg .t p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.home .control { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 10px; min-height: 36px; cursor: pointer; font-weight: 600; font-size: 13px; }
.home .sk { height: 14px; border-radius: 6px; background: var(--surface-2); margin: 8px 0; }
@media (max-width: 1100px) { .home .cols { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .home .hm-hero { grid-template-columns: 1fr; } .home .countdown strong { font-size: 44px; } }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
</head>
<body class="setup-app home">
<header class="top">
  <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Buka menu" aria-expanded="false">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="home.html"><span class="logo">PP</span>
    <span><small>Project Check List SAP B1</small><span id="company-name">CV. Putra Prima Mandiri</span></span></a>
  <button class="icon-btn" id="theme-btn" type="button" aria-label="Ganti tema terang/gelap" style="margin-left:auto">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
  </button>
</header>
<div class="shell">
  <aside class="sidebar" aria-label="Navigasi"></aside>
  <main class="content"><article class="article">
    <header class="hm-head"><div><h1>Home</h1><p>Ringkasan proyek SAP B1 menuju Go Live.</p></div></header>
    <div id="home"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </article></main>
</div>
<script type="module" src="js/pages/home.js"></script>
</body>
</html>

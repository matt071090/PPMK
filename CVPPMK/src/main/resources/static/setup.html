<!doctype html>
<html lang="id">

<title>Setup &amp; Cut Off</title>
<link rel="stylesheet" href="css/app.css">
<script>try { const t = localStorage.getItem("theme"); document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<script src="js/modnav.js" defer></script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
</head>
<body class="setup-app">
<header class="top">
  <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Buka menu">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/"><span class="logo" id="company-logo">NC</span>
    <span><small>Setup &amp; Cut Off SAP B1</small><span id="company-name">No company</span></span></a>

  </a>
  <span id="setup-chat-slot"></span>
  <button class="icon-btn" id="theme-btn" type="button" aria-label="Ganti tema terang/gelap">

  </button>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="Langkah setup"><nav id="nav"></nav></aside>
  <main class="content"><p id="setup-capability" role="status"></p><article class="article" id="article"></article></main>

import { startSetupApp } from "./js/pages/setup.js";
startSetupApp();
